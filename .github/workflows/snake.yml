# Katkı grafiğinden yılan animasyonu üretir ve "output" dalına yazar.
# README bu daldaki SVG dosyalarını gösterir.
name: Yılan animasyonu

on:
  schedule:
    - cron: "0 0 * * *" # her gün bir kez güncelle
  workflow_dispatch: # Actions sekmesinden elle çalıştırma
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Yılan SVG'lerini üret
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg
            dist/github-snake-dark.svg?palette=github-dark

      - name: output dalına yayınla
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
