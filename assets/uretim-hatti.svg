<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 225" width="800" height="225" role="img" aria-label="Maskot Serhatonin, şişelerin dolup kapaklandığı üretim hattında tabletiyle kalite kontrolü yapıyor">
  <title>Serhatonin · üretim hattı</title>
  <style>
    text { font-family: 'Segoe UI', Verdana, sans-serif; fill: #8b949e; }
    .lbl { font-size: 11px; font-weight: 700; letter-spacing: 2px; text-anchor: middle; }
    .cap-txt { font-size: 12px; text-anchor: middle; }

    /* şişeler: 8 sn'de hattı geçer, 6 şişe 1.333 sn arayla */
    .bottle { animation: move 8s linear infinite; animation-delay: var(--d); }
    @keyframes move { from { transform: translateX(0); } to { transform: translateX(660px); } }
    .liquid { transform-box: fill-box; transform-origin: bottom; animation: fill 8s linear infinite; animation-delay: var(--d); }
    @keyframes fill { 0%, 29% { transform: scaleY(0); } 34%, 100% { transform: scaleY(1); } }
    .cap { animation: capon 8s linear infinite; animation-delay: var(--d); }
    @keyframes capon { 0%, 54% { transform: translateY(-14px); opacity: 0; } 55% { opacity: 1; } 57%, 100% { transform: translateY(0); opacity: 1; } }
    .ok { transform-box: fill-box; transform-origin: center; animation: okon 8s linear infinite; animation-delay: var(--d); }
    @keyframes okon { 0%, 80% { transform: scale(0); opacity: 0; } 83% { transform: scale(1.3); opacity: 1; } 86%, 100% { transform: scale(1); opacity: 1; } }

    /* istasyonlar, şişe ritmiyle (1.333 sn) senkron */
    .stream { animation: stream 1.3333s linear infinite; }
    @keyframes stream { 0%, 3% { opacity: 1; } 4%, 73% { opacity: 0; } 74%, 100% { opacity: 1; } }
    .press { animation: press 1.3333s ease-in-out infinite; }
    @keyframes press { 0%, 22% { transform: translateY(0); } 34% { transform: translateY(8px); } 44%, 100% { transform: translateY(0); } }
    .beam { animation: beam 1.3333s linear infinite; }
    @keyframes beam { 0%, 68% { opacity: 0; } 80% { opacity: .45; } 94%, 100% { opacity: 0; } }

    .belt { animation: belt .26s linear infinite; }
    @keyframes belt { to { stroke-dashoffset: -30; } }
    .spin { transform-box: fill-box; transform-origin: center; animation: spin 1.2s linear infinite; }
    .spin-r { transform-box: fill-box; transform-origin: center; animation: spin 0.9s linear infinite reverse; }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* Serhatonin */
    .bob { animation: bob 2.4s ease-in-out infinite alternate; }
    @keyframes bob { to { transform: translateY(-3px); } }
    .eye { transform-box: fill-box; transform-origin: center; animation: blink 4s infinite; }
    @keyframes blink { 0%, 90%, 100% { transform: scaleY(1); } 94% { transform: scaleY(.1); } }
    .wave { transform-box: fill-box; transform-origin: 0% 95%; animation: wave 4s ease-in-out infinite; }
    @keyframes wave { 0%, 55%, 100% { transform: rotate(0); } 65% { transform: rotate(22deg); } 75% { transform: rotate(-4deg); } 85% { transform: rotate(22deg); } }
    .glow { animation: glow 1.6s ease-in-out infinite alternate; }
    @keyframes glow { from { opacity: .35; } to { opacity: 1; } }
    .twinkle { transform-box: fill-box; transform-origin: center; animation: twinkle 2s ease-in-out infinite alternate; }
    @keyframes twinkle { from { transform: scale(.6) rotate(0); } to { transform: scale(1.1) rotate(45deg); } }
  </style>

  <defs>
    <linearGradient id="fade" x1="0" x2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/>
      <stop offset=".06" stop-color="#fff"/>
      <stop offset=".94" stop-color="#fff"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <mask id="beltmask"><rect x="20" y="0" width="590" height="225" fill="url(#fade)"/></mask>

    <radialGradient id="body" cx=".36" cy=".3" r=".8">
      <stop offset="0" stop-color="#bff0ff"/>
      <stop offset=".35" stop-color="#5fd0ff"/>
      <stop offset=".8" stop-color="#2a9fe0"/>
      <stop offset="1" stop-color="#1b7fc0"/>
    </radialGradient>
    <radialGradient id="limb" cx=".35" cy=".3" r=".9">
      <stop offset="0" stop-color="#8fe0ff"/>
      <stop offset="1" stop-color="#2a9fe0"/>
    </radialGradient>
    <linearGradient id="hat" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffbb55"/>
      <stop offset=".55" stop-color="#f28c28"/>
      <stop offset="1" stop-color="#d9661a"/>
    </linearGradient>
    <radialGradient id="iris" cx=".4" cy=".35" r=".7">
      <stop offset="0" stop-color="#2e7fa8"/>
      <stop offset=".6" stop-color="#123a57"/>
      <stop offset="1" stop-color="#081a2b"/>
    </radialGradient>
    <radialGradient id="orb" cx=".4" cy=".35" r=".7">
      <stop offset="0" stop-color="#e9ddff"/>
      <stop offset=".5" stop-color="#a57cff"/>
      <stop offset="1" stop-color="#6b3fd6"/>
    </radialGradient>
    <radialGradient id="orbglow" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#b388ff" stop-opacity=".8"/>
      <stop offset="1" stop-color="#b388ff" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="mouth"><path d="M226 300 Q256 342 286 300 Q256 310 226 300 Z"/></clipPath>

    <g id="btl">
      <rect x="-12" y="-46" width="24" height="46" rx="6" fill="#36BCF7" fill-opacity=".08" stroke="#36BCF7" stroke-width="1.6"/>
      <rect x="-5" y="-52" width="10" height="7" fill="#36BCF7" fill-opacity=".08" stroke="#36BCF7" stroke-width="1.4"/>
      <rect class="liquid" x="-10" y="-42" width="20" height="40" rx="4" fill="#36BCF7" fill-opacity=".85"/>
      <rect class="cap" x="-6.5" y="-58" width="13" height="6" rx="1.5" fill="#E67E22"/>
      <g class="ok">
        <circle cx="0" cy="-22" r="8" fill="#2ea043"/>
        <path d="M-4 -22 l3 3 l5 -6" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      </g>
    </g>
  </defs>

  <!-- zemin -->
  <line x1="10" y1="200" x2="790" y2="200" stroke="#8b949e" stroke-opacity=".35"/>

  <!-- istasyon etiketleri -->
  <text class="lbl" x="180" y="40">DOLUM</text>
  <text class="lbl" x="340" y="40">KAPAK</text>
  <text class="lbl" x="500" y="40">KALİTE</text>

  <!-- dolum istasyonu -->
  <line x1="180" y1="48" x2="180" y2="70" stroke="#8b949e" stroke-width="2"/>
  <rect x="162" y="66" width="36" height="28" rx="6" fill="#203a43" stroke="#36BCF7" stroke-width="1.6"/>
  <rect x="166" y="78" width="28" height="12" rx="3" fill="#36BCF7" fill-opacity=".7"/>
  <rect x="176" y="94" width="8" height="10" fill="#8b949e"/>
  <rect class="stream" x="178" y="104" width="4" height="16" rx="2" fill="#36BCF7"/>

  <!-- kapak istasyonu -->
  <rect x="318" y="46" width="44" height="6" rx="2" fill="#8b949e"/>
  <g class="press">
    <rect x="337" y="52" width="6" height="34" fill="#8b949e"/>
    <rect x="326" y="84" width="28" height="10" rx="3" fill="#E67E22"/>
  </g>

  <!-- bant -->
  <rect x="20" y="160" width="590" height="16" rx="8" fill="#2c3e50"/>
  <line class="belt" x1="28" y1="161" x2="602" y2="161" stroke="#8b949e" stroke-width="2" stroke-dasharray="14 16"/>
  <g fill="#8b949e">
    <g class="spin"><circle cx="40" cy="168" r="5"/><rect x="39" y="163" width="2" height="10" fill="#2c3e50"/></g>
    <g class="spin"><circle cx="150" cy="168" r="5"/><rect x="149" y="163" width="2" height="10" fill="#2c3e50"/></g>
    <g class="spin"><circle cx="260" cy="168" r="5"/><rect x="259" y="163" width="2" height="10" fill="#2c3e50"/></g>
    <g class="spin"><circle cx="370" cy="168" r="5"/><rect x="369" y="163" width="2" height="10" fill="#2c3e50"/></g>
    <g class="spin"><circle cx="480" cy="168" r="5"/><rect x="479" y="163" width="2" height="10" fill="#2c3e50"/></g>
    <g class="spin"><circle cx="590" cy="168" r="5"/><rect x="589" y="163" width="2" height="10" fill="#2c3e50"/></g>
  </g>
  <line x1="40" y1="176" x2="40" y2="200" stroke="#8b949e" stroke-width="3"/>
  <line x1="590" y1="176" x2="590" y2="200" stroke="#8b949e" stroke-width="3"/>

  <!-- dişliler -->
  <g class="spin"><circle cx="300" cy="188" r="7" fill="none" stroke="#E67E22" stroke-width="5" stroke-dasharray="3 2.5"/></g>
  <g class="spin-r"><circle cx="318" cy="186" r="5" fill="none" stroke="#E67E22" stroke-width="4" stroke-dasharray="2.5 2"/></g>

  <!-- şişeler -->
  <g mask="url(#beltmask)">
    <g transform="translate(-30 160)">
      <g class="bottle" style="--d:0s"><use href="#btl"/></g>
      <g class="bottle" style="--d:-1.3333s"><use href="#btl"/></g>
      <g class="bottle" style="--d:-2.6667s"><use href="#btl"/></g>
      <g class="bottle" style="--d:-4s"><use href="#btl"/></g>
      <g class="bottle" style="--d:-5.3333s"><use href="#btl"/></g>
      <g class="bottle" style="--d:-6.6667s"><use href="#btl"/></g>
    </g>
  </g>

  <!-- tarama ışını (tabletten) -->
  <polygon class="beam" points="618,128 492,104 492,160" fill="#8A2BE2"/>

  <!-- zemin gölgesi -->
  <ellipse cx="710" cy="201" rx="56" ry="6" fill="#000" fill-opacity=".25"/>

  <!-- ===== Serhatonin (512'lik çizim 0.44 ölçekte) ===== -->
  <g class="bob">
  <g transform="translate(597 2) scale(.44)">
    <g stroke="#10243a" stroke-width="7" stroke-linejoin="round" stroke-linecap="round">
      <!-- botlar -->
      <path d="M178 420 Q178 398 206 398 L232 398 Q250 398 250 418 L250 436 Q250 446 238 446 L188 446 Q176 446 176 434 Z" fill="#34495e"/>
      <path d="M262 418 Q262 398 280 398 L306 398 Q334 398 334 420 L336 434 Q336 446 324 446 L274 446 Q262 446 262 436 Z" fill="#34495e"/>
      <path d="M180 432 L248 432" stroke="#f28c28" stroke-width="6"/>
      <path d="M264 432 L332 432" stroke="#f28c28" stroke-width="6"/>

      <!-- sağ kol: el sallıyor -->
      <g class="wave">
        <path d="M362 300 Q400 280 414 226" fill="none" stroke-width="34"/>
        <path d="M362 300 Q400 280 414 226" fill="none" stroke="url(#limb)" stroke-width="22"/>
        <circle cx="416" cy="214" r="22" fill="url(#limb)"/>
        <ellipse cx="398" cy="206" rx="8" ry="11" fill="url(#limb)" stroke-width="5" transform="rotate(-25 398 206)"/>
      </g>

      <!-- gövde -->
      <path d="M299.3 175 L329.7 192.5 Q373 217.5 373 267.5 L373 302.5 Q373 352.5 329.7 377.5 L299.3 395 Q256 420 212.7 395 L182.3 377.5 Q139 352.5 139 302.5 L139 267.5 Q139 217.5 182.3 192.5 L212.7 175 Q256 150 299.3 175 Z" fill="url(#body)"/>
    </g>

    <path d="M168 238 Q172 205 205 188" fill="none" stroke="#fff" stroke-opacity=".55" stroke-width="9" stroke-linecap="round"/>
    <ellipse cx="256" cy="355" rx="62" ry="34" fill="#dff7ff" fill-opacity=".45"/>
    <g fill="none" stroke="#1b7fc0" stroke-width="4" stroke-linejoin="round" opacity=".9">
      <path d="M240 340 l11 6.5 v13 l-11 6.5 l-11 -6.5 v-13 z"/>
      <path d="M251 346.5 l12 -4 l7.5 10 l-7.5 10 l-12 -4"/>
    </g>

    <!-- sol kol + tablet (şişelere dönük) -->
    <g stroke="#10243a" stroke-linejoin="round" stroke-linecap="round">
      <path d="M150 312 Q120 330 110 352" fill="none" stroke-width="34"/>
      <path d="M150 312 Q120 330 110 352" fill="none" stroke="url(#limb)" stroke-width="22"/>
      <g transform="rotate(-10 92 300)">
        <rect x="46" y="246" width="88" height="112" rx="12" fill="#1c2b3a" stroke-width="7"/>
        <rect x="56" y="256" width="68" height="88" rx="6" fill="#0b2235" stroke="none"/>
        <rect x="65" y="312" width="12" height="24" rx="2" fill="#2ecc71" stroke="none"/>
        <rect x="83" y="298" width="12" height="38" rx="2" fill="#ffb347" stroke="none"/>
        <rect x="101" y="280" width="12" height="56" rx="2" fill="#b388ff" stroke="none"/>
        <path d="M66 300 L84 286 L98 290 L114 266" fill="none" stroke="#5fd0ff" stroke-width="4"/>
        <path d="M106 266 L115 264 L114 274" fill="none" stroke="#5fd0ff" stroke-width="4"/>
        <circle class="glow" cx="50" cy="262" r="7" fill="#b388ff" stroke="none"/>
      </g>
      <circle cx="110" cy="356" r="20" fill="url(#limb)" stroke-width="7"/>
    </g>

    <!-- yüz: gözler şişelere bakıyor -->
    <g class="eye">
      <ellipse cx="216" cy="262" rx="27" ry="31" fill="#fff" stroke="#10243a" stroke-width="6"/>
      <circle cx="207" cy="266" r="19" fill="url(#iris)"/>
      <circle cx="206" cy="267" r="9" fill="#050f1a"/>
      <circle cx="213" cy="257" r="7.5" fill="#fff"/>
      <circle cx="200" cy="276" r="3.5" fill="#fff" fill-opacity=".85"/>
    </g>
    <g class="eye">
      <ellipse cx="296" cy="262" rx="27" ry="31" fill="#fff" stroke="#10243a" stroke-width="6"/>
      <circle cx="287" cy="266" r="19" fill="url(#iris)"/>
      <circle cx="286" cy="267" r="9" fill="#050f1a"/>
      <circle cx="293" cy="257" r="7.5" fill="#fff"/>
      <circle cx="280" cy="276" r="3.5" fill="#fff" fill-opacity=".85"/>
    </g>
    <path d="M196 222 Q214 210 232 218" fill="none" stroke="#10243a" stroke-width="6" stroke-linecap="round"/>
    <path d="M280 218 Q298 210 316 222" fill="none" stroke="#10243a" stroke-width="6" stroke-linecap="round"/>
    <ellipse cx="184" cy="306" rx="17" ry="9.5" fill="#ff7f9a" fill-opacity=".55"/>
    <ellipse cx="328" cy="306" rx="17" ry="9.5" fill="#ff7f9a" fill-opacity=".55"/>
    <path d="M226 300 Q256 342 286 300 Q256 310 226 300 Z" fill="#4a1022"/>
    <ellipse cx="256" cy="324" rx="15" ry="9" fill="#ff7a95" clip-path="url(#mouth)"/>
    <path d="M226 300 Q256 342 286 300 Q256 310 226 300 Z" fill="none" stroke="#10243a" stroke-width="5" stroke-linejoin="round"/>

    <!-- anten: serotonin zinciri + yapay zekâ kıvılcımı -->
    <polyline points="256,104 276,76 260,50" fill="none" stroke="#10243a" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
    <polyline points="256,104 276,76 260,50" fill="none" stroke="#9aa9b8" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <circle class="glow" cx="264" cy="38" r="32" fill="url(#orbglow)"/>
    <circle cx="264" cy="38" r="14" fill="url(#orb)" stroke="#10243a" stroke-width="5"/>
    <circle cx="259" cy="33" r="4" fill="#fff" fill-opacity=".9"/>
    <path class="twinkle" d="M296 22 l3.5 8 l8 3.5 l-8 3.5 l-3.5 8 l-3.5 -8 l-8 -3.5 l8 -3.5 z" fill="#d9c6ff"/>

    <!-- baret -->
    <g stroke="#10243a" stroke-width="7" stroke-linejoin="round">
      <path d="M168 192 Q168 102 256 102 Q344 102 344 192 Z" fill="url(#hat)"/>
      <path d="M240 106 Q256 101 272 106 L270 190 L242 190 Z" fill="#ffc56b" stroke-width="5"/>
      <rect x="144" y="184" width="224" height="22" rx="11" fill="#e0701a"/>
    </g>
    <path d="M190 160 Q196 128 226 116" fill="none" stroke="#fff" stroke-opacity=".55" stroke-width="8" stroke-linecap="round"/>
    <path transform="translate(306 156)" d="M0 -12 l10.4 6 v12 l-10.4 6 l-10.4 -6 v-12 z" fill="none" stroke="#fff" stroke-opacity=".85" stroke-width="3.5" stroke-linejoin="round"/>
  </g>
  </g>

  <text class="cap-txt" x="710" y="218" font-weight="700" style="fill:#36BCF7">Serhatonin</text>
  <text class="cap-txt" x="315" y="218">Doldur · kapakla · yapay zekâ ile kontrol et</text>
</svg>
