<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1080,height=1920">
<title>Ruby Rose France — story 9:16</title>
<link rel="stylesheet" href="fonts.css">
<style>
:root{
  --night:#140A0F;--plum:#4A1631;--ruby:#B8123F;--rose:#EA5174;--blush:#F7D9DF;--ivory:#FBF6F2;--gold:#D9B072;--hl:#F17C98;
  --serif:"Instrument Serif","Times New Roman",Georgia,serif;
  --sans:Montserrat,"Helvetica Neue",Arial,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
}
*,*::before,*::after{box-sizing:border-box;transition:none!important;animation:none!important}
html,body{margin:0;width:1080px;height:1920px;overflow:hidden;background:var(--night)}
body{color:var(--ivory);font:400 28px/1.4 var(--sans);-webkit-font-smoothing:antialiased;text-rendering:geometricPrecision}
#stage{position:relative;width:1080px;height:1920px;overflow:hidden;background:var(--night);isolation:isolate}
#gl{position:absolute;left:0;top:0;width:1080px;height:1920px;display:block}
.layer{position:absolute;inset:0;pointer-events:none}
.abs{position:absolute;left:0;top:0;transform-origin:50% 50%}
.c{translate:-50% -50%}
.lc{translate:0 -50%}
.rt{translate:-100% 0}
.ct{translate:-50% 0}
.serif{font-family:var(--serif);font-weight:400;letter-spacing:-.02em}
.serif em,.em{font-style:italic;color:var(--hl)}
.mono{font-family:var(--mono);font-weight:500;text-transform:uppercase;letter-spacing:.22em;font-size:22px;line-height:1.4}
.sans-up{font-family:var(--sans);font-weight:600;text-transform:uppercase;letter-spacing:.2em;font-size:28px;line-height:1.3}
.nowrap{white-space:nowrap}
.ln{display:block;overflow:clip;overflow-clip-margin:.08em;padding:0 .12em .16em 0;margin:0 0 -.16em 0;white-space:nowrap}
.li{display:inline-block;transform-origin:0 100%;will-change:transform}
/* products */
.prod{will-change:transform,opacity}
.prod .clip{position:absolute;inset:0;overflow:hidden}
.prod img{position:absolute;top:0;display:block;max-width:none}
.prod .sheen{position:absolute;top:0;display:block;background:linear-gradient(104deg,rgba(255,244,238,0) 0%,rgba(255,244,238,0) 40%,rgba(255,244,238,.78) 50%,rgba(255,244,238,0) 60%,rgba(255,244,238,0) 100%);background-size:260% 100%;background-repeat:no-repeat;mix-blend-mode:screen;-webkit-mask-repeat:no-repeat;mask-repeat:no-repeat;opacity:0}
.prod .csh{position:absolute;left:50%;bottom:-2.5%;width:96%;height:7%;translate:-50% 0;background:radial-gradient(closest-side,rgba(6,2,4,.62),rgba(6,2,4,0));}
.dark .prod{filter:drop-shadow(0 34px 38px rgba(6,2,4,.55))}
.light .prod{filter:drop-shadow(0 26px 30px rgba(52,10,28,.50))}
.light .prod .csh{background:radial-gradient(closest-side,rgba(74,22,49,.38),rgba(74,22,49,0))}
.chip{position:absolute;left:0;top:0;border-radius:50%;translate:-50% -50%;box-shadow:inset -6px -8px 14px rgba(0,0,0,.22),inset 5px 6px 10px rgba(255,255,255,.28),0 6px 14px rgba(0,0,0,.35)}
.hair{position:absolute;height:1px;background:rgba(251,246,242,.35);transform-origin:0 50%}
.hair.gold{background:var(--gold)}
.dot{position:absolute;width:12px;height:12px;border-radius:50%;background:var(--gold);translate:-50% -50%;box-shadow:0 0 18px rgba(217,176,114,.8)}
#grain{position:absolute;inset:0;width:1080px;height:1920px;mix-blend-mode:overlay;opacity:.06;pointer-events:none;image-rendering:auto}
#vig{position:absolute;inset:0;background:radial-gradient(130% 90% at 50% 46%,rgba(20,10,15,0) 55%,rgba(20,10,15,.55) 100%);pointer-events:none}
#fade{position:absolute;inset:0;background:var(--night);opacity:0;pointer-events:none}
.odo{display:inline-block;height:1em;overflow:hidden;vertical-align:top;line-height:1em}
.odo i{display:block;font-style:normal;line-height:1em;height:1em;will-change:transform}
.odo i b{display:block;height:1em;font-weight:400}
.eyebrow{display:flex;align-items:center;gap:20px;color:var(--rose)}
.eyebrow .bar{display:inline-block;width:56px;height:1px;background:var(--gold)}
</style>
</head>
<body>
<div id="stage">
  <canvas id="gl" width="720" height="1280"></canvas>
  <div id="L" class="layer"></div>
  <div id="vig"></div>
  <div id="chrome" class="layer"></div>
  <canvas id="grain" width="540" height="960"></canvas>
  <div id="fade"></div>
</div>
<script>
'use strict';
/* =========================================================
   Ruby Rose France — 9:16 story. Deterministic: every pixel
   is a pure function of the seek time t (window.__seek(t)).
   ========================================================= */
const Q = new URLSearchParams(location.search);
const LANG = (Q.get('lang') || window.__LANG || 'fr') === 'tr' ? 'tr' : 'fr';
document.documentElement.lang = LANG;
const DUR = 25;
const IMG = '../../assets/img/';
/* shade manifest of the Classic range (name + hex per shade), read synchronously so the build is deterministic */
window.__MAN = (() => { const x = new XMLHttpRequest(); x.open('GET', IMG + 'classic/manifest.json', false); x.send(); return JSON.parse(x.responseText); })();

/* ---------- copy (FR default, TR second version; all strings taken from the site) ---------- */
const COPY = {
  fr: {
    badge: '#FormuléEnFrance · Laboratoire R&D · Sèvres · ',
    lab: ['Laboratoire', 'de formulation', '<em>cosmétique</em>'],
    place: 'Sèvres <span style="color:var(--gold)">·</span> Paris',
    tag: 'Formulé en France',
    eb: ['Le laboratoire', 'Teint', 'Joues', 'Lèvres', 'Yeux', 'Ruby Rose en chiffres'],
    teintN: 'teintes', daily: 'Fond de teint Daily Skin',
    cp: 'Correcteur <span class="em" style="color:var(--gold)">·</span> Poudre', cpSub: 'Blur Me · Light Filter',
    blushSub: 'Blush On Me',
    lips: 'Gloss <span class="em" style="color:var(--ruby)">·</span> Rouge à lèvres',
    lumenSub: 'Lumen · Gloss à lèvres de la ligne Wonder', moodSub: 'Mood · Rouge à lèvres liquide',
    eyes: 'Mascara', eyesSub: 'Volume &amp; courbe',
    figs: ['pays de distribution', 'références maquillage', 'produits vendus chaque année'],
    claim: ['La <em>French Touch</em>', 'pour de nouveaux', 'horizons de beauté'],
  },
  tr: {
    badge: '#FormuléEnFrance · Ar-Ge laboratuvarı · Sèvres · ',
    lab: ['Kozmetik', 'formülasyon', '<em>laboratuvarı</em>'],
    place: 'Sèvres <span style="color:var(--gold)">·</span> Paris',
    tag: 'Fransa’da formüle edildi',
    eb: ['Laboratuvar', 'Ten', 'Yanaklar', 'Dudaklar', 'Gözler', 'Rakamlarla Ruby Rose'],
    teintN: 'ton', daily: '<span lang="en">Daily Skin</span> fondöten',
    cp: 'Kapatıcı <span class="em" style="color:var(--gold)">·</span> Pudra', cpSub: 'Blur Me · Light Filter',
    blushSub: 'Blush On Me',
    lips: 'Gloss <span class="em" style="color:var(--ruby)">·</span> Ruj',
    lumenSub: '<span lang="en">Lumen · Wonder</span> serisinden dudak parlatıcısı', moodSub: '<span lang="en">Mood</span> · Likit ruj',
    eyes: 'Maskara', eyesSub: 'Hacim ve kıvrım',
    figs: ['ülkede dağıtım', 'makyaj referansı', 'ürün her yıl satılıyor'],
    claim: ['Yeni güzellik', 'ufukları için', '<em>Fransız</em> dokunuşu'],
  }
}[LANG];

/* ---------- tiny deterministic toolkit ---------- */
const stage = document.getElementById('stage'), L = document.getElementById('L'), CH = document.getElementById('chrome');
const E = (tag, cls, par, html) => { const e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; (par || L).appendChild(e); return e; };
const cl = (x, a = 0, b = 1) => x < a ? a : x > b ? b : x;
const pr = (t, a, b) => cl((t - a) / (b - a));
const mix = (a, b, k) => a + (b - a) * k;
const eo3 = k => 1 - Math.pow(1 - k, 3), eo5 = k => 1 - Math.pow(1 - k, 5);
const eexp = k => k >= 1 ? 1 : 1 - Math.pow(2, -10 * k);
const ei3 = k => k * k * k, ei2 = k => k * k;
const eio = k => k < .5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2;
const eback = k => { const c1 = 1.25, c3 = c1 + 1; return 1 + c3 * Math.pow(k - 1, 3) + c1 * Math.pow(k - 1, 2); };
/* window factor: rises over [a,a+fi], falls over [b-fo,b] */
const win = (t, a, b, fi = .3, fo = .3) => Math.min(pr(t, a, a + fi), 1 - pr(t, b - fo, b));
function T(el, x, y, s = 1, r = 0, o = 1, f) {
  el.style.transform = 'translate(' + x.toFixed(2) + 'px,' + y.toFixed(2) + 'px) rotate(' + r.toFixed(3) + 'deg) scale(' + (+s).toFixed(4) + ')';
  el.style.opacity = o.toFixed(4);
  el.style.visibility = o <= 0.002 ? 'hidden' : 'visible';
  if (f !== undefined) el.style.filter = f;
}
function show(el, o) { el.style.opacity = o.toFixed(4); el.style.visibility = o <= 0.002 ? 'hidden' : 'visible'; }
/* seeded PRNG (mulberry32) for any "random" layout */
function rng(seed) { return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }

/* text helpers: masked lines (site .w/.wi reveal) and fit-to-width */
function lines(par, cls, arr, style) {
  const b = E('div', 'abs ' + cls, par); if (style) b.style.cssText += style;
  b._li = arr.map(h => { const ln = E('span', 'ln', b); return E('span', 'li', ln, h); });
  return b;
}
function revealLines(b, t, t0, stag = .08, dur = .62, tOut = null, outDur = .3) {
  b._li.forEach((li, i) => {
    const k = eo5(pr(t, t0 + i * stag, t0 + i * stag + dur));
    let y = (1 - k) * 140, r = (1 - k) * 4;
    if (tOut != null) { const ko = ei3(pr(t, tOut + i * .04, tOut + i * .04 + outDur)); y -= ko * 140; }
    li.style.transform = 'translateY(' + y.toFixed(2) + '%) rotate(' + r.toFixed(3) + 'deg)';
  });
}
const FITS = [];
function fit(el, maxW) { FITS.push([el, maxW]); return el; }
function runFits() {
  FITS.forEach(([el, maxW]) => {
    const cs = getComputedStyle(el); let fs = parseFloat(cs.fontSize);
    const prevT = el.style.transform; el.style.transform = 'none';
    const meas = () => { let w = 0; const kids = el.querySelectorAll('.li'); if (kids.length) kids.forEach(k => { w = Math.max(w, k.getBoundingClientRect().width); }); else w = el.getBoundingClientRect().width; return w; };
    let guard = 0;
    while (meas() > maxW && guard++ < 60) { fs *= .97; el.style.fontSize = fs.toFixed(2) + 'px'; }
    el.style.transform = prevT;
  });
}

/* product cut-outs: soft drop shadow, contact shadow, masked light sweep */
const NAT = {
  'blush-on-me-pink-thrill': [791, 794], 'concealer-blur-me-l35': [213, 892], 'concealer-blur-me-md100': [213, 893],
  'foundation-daily-skin-d150': [313, 906], 'foundation-daily-skin-l20': [314, 906], 'foundation-daily-skin-m60': [313, 906],
  'gloss-lumen-clear': [439, 760], 'gloss-lumen-glorious': [417, 760], 'gloss-lumen-lux': [416, 745], 'gloss-lumen-shining': [422, 750], 'gloss-lumen-star': [428, 760],
  'highlighter-baked-glowing-rules': [649, 743], 'lipstick-mood-desire': [355, 946], 'lipstick-mood-romance': [351, 955], 'lipstick-mood-wish': [353, 945],
  'mascara-cat-eye': [156, 904], 'mascara-curve-volume': [156, 909], 'mascara-epic-lashes': [183, 902], 'mascara-feels-stunning': [183, 902],
  'mascara-glass': [551, 938], 'mascara-length-definition': [156, 909], 'mascara-tropico-power-volume': [139, 976],
  'powder-baked-filter-pb60': [845, 914], 'powder-glass-gpd20': [679, 888], 'powder-light-filter-p25': [543, 667], 'powder-light-filter-p5': [543, 667],
};
const IMGS = [];
function prod(par, name, h, o = {}) {
  const [nw, nh] = NAT[name], sc = h / nh, crop = (o.crop || 0) * sc, iw = nw * sc;
  const w = iw - crop;
  const el = E('div', 'abs c prod', par); el.style.width = w.toFixed(1) + 'px'; el.style.height = h + 'px';
  if (o.csh !== false) E('i', 'csh', el);
  const clip = E('div', 'clip', el);
  const src = IMG + 'products/' + name + '.webp';
  const im = E('img', '', clip); im.src = src; im.style.width = iw.toFixed(1) + 'px'; im.style.height = h + 'px'; im.style.left = (-crop).toFixed(1) + 'px';
  IMGS.push(im);
  if (o.backing) { const bk = E('img', '', clip); bk.src = src; IMGS.push(bk); bk.style.cssText += `width:${iw.toFixed(1)}px;height:${h}px;left:${(-crop).toFixed(1)}px;filter:brightness(0) invert(1);opacity:${o.backing}`; clip.insertBefore(bk, im); }
  const sh = E('i', 'sheen', clip);
  sh.style.left = (-crop).toFixed(1) + 'px'; sh.style.width = iw.toFixed(1) + 'px'; sh.style.height = h + 'px';
  sh.style.webkitMaskImage = sh.style.maskImage = 'url(' + src + ')';
  sh.style.webkitMaskSize = sh.style.maskSize = iw.toFixed(1) + 'px ' + h + 'px';
  return { el, w, h, sweep(k, a = 1) { sh.style.backgroundPosition = mix(118, -18, k).toFixed(2) + '% 0'; sh.style.opacity = (k > 0 && k < 1 ? a : 0).toFixed(3); } };
}
function img(par, path, w, cls = 'abs c') { const i = E('img', cls, par); i.src = IMG + path; i.style.width = w + 'px'; IMGS.push(i); return i; }

/* =========================================================
   BACKGROUND · liquid pigment (fbm domain warp from the site's hero shader)
   ========================================================= */
const GL = (() => {
  const cv = document.getElementById('gl');
  const gl = cv.getContext('webgl', { antialias: false, alpha: false, depth: false, preserveDrawingBuffer: true });
  gl.getExtension('OES_standard_derivatives');
  const FS = `#extension GL_OES_standard_derivatives : enable
precision highp float;
uniform vec2 uR,uC;uniform float uT,uAmt,uB,uRing,uSw,uVein,uSpec,uVig,uSeed;
uniform vec3 c0,c1,c2,c3,c4;
vec2 hh(vec2 p){p=vec2(dot(p,vec2(127.1,311.7)),dot(p,vec2(269.5,183.3)));return fract(sin(p)*43758.5453)*2.-1.;}
float gn(vec2 p){vec2 i=floor(p),f=fract(p),u=f*f*(3.-2.*f);return mix(mix(dot(hh(i),f),dot(hh(i+vec2(1.,0.)),f-vec2(1.,0.)),u.x),mix(dot(hh(i+vec2(0.,1.)),f-vec2(0.,1.)),dot(hh(i+1.),f-1.),u.x),u.y);}
float fbm(vec2 p){float s=0.,a=.5;mat2 m=mat2(1.6,1.2,-1.2,1.6);for(int i=0;i<5;i++){s+=a*gn(p);p=m*p;a*=.5;}return s;}
void main(){
vec2 uv=gl_FragCoord.xy/uR;float as=uR.x/uR.y;
vec2 p=vec2(uv.x*as,uv.y);vec2 cc=vec2(uC.x*as,uC.y);vec2 d=p-cc;float dl=length(d);
float k=exp(-dl*dl*5.);float an=k*uSw;float cs=cos(an),sn=sin(an);
p=cc+mat2(cs,sn,-sn,cs)*d*(1.-k*.12*min(uSw,3.)/3.);
float t=uT*.085;vec2 P=p*1.55+vec2(uSeed,uSeed*.37);
vec2 q=vec2(fbm(P+vec2(0.,t)),fbm(P+vec2(5.2,1.3)-t*.8));
vec2 r=vec2(fbm(P+3.2*q+vec2(1.7,9.2)+t*1.3),fbm(P+3.2*q+vec2(8.3,2.8)-t));
float v=clamp(fbm(P+3.4*r)*1.3+.5,0.,1.);
vec3 col=mix(c0,c1,smoothstep(.05,.38,v));col=mix(col,c2,smoothstep(.36,.62,v));col=mix(col,c3,smoothstep(.62,.86,v));col=mix(col,c4,smoothstep(.87,1.,v)*.65);
float ln=length(r);col=mix(col,c0,smoothstep(.5,.95,ln)*.4);
float vein=abs(fract(v*5.+ln*1.6)-.5);col+=vec3(.851,.69,.447)*smoothstep(.035,0.,vein)*uVein*smoothstep(.3,.8,v);
vec2 X=P+3.4*r;float e=1.55/uR.y;float v0=fbm(X);
vec3 n=normalize(vec3(-vec2(fbm(X+vec2(e,0.))-v0,fbm(X+vec2(0.,e))-v0)*1.3*uR.y*.2,1.));
col+=pow(max(dot(n,normalize(vec3(-.5,.6,.62))),0.),22.)*uSpec*1.4*vec3(1.,.93,.95)*smoothstep(.15,.6,v);
col*=1.-uVig*smoothstep(.45,1.2,length((uv-vec2(.5,.48))*vec2(as,1.)));
float edge=dl+fbm(d*4.+uSeed)*.09;
float m=smoothstep(uB,uB-.10,edge);
vec3 bg=vec3(.078,.039,.059);
col=mix(bg,col,m*uAmt);
col+=mix(c3,c4,.45)*exp(-abs(edge-uB)*22.)*uRing;
gl_FragColor=vec4(col,1.);}`;
  const VS = 'attribute vec2 a;void main(){gl_Position=vec4(a,0.,1.);}';
  const sh = (ty, src) => { const s = gl.createShader(ty); gl.shaderSource(s, src); gl.compileShader(s); if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s)); return s; };
  const p = gl.createProgram(); gl.attachShader(p, sh(gl.VERTEX_SHADER, VS)); gl.attachShader(p, sh(gl.FRAGMENT_SHADER, FS)); gl.linkProgram(p); gl.useProgram(p);
  const b = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, b); gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW);
  const loc = gl.getAttribLocation(p, 'a'); gl.enableVertexAttribArray(loc); gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);
  const U = {}; ['uR', 'uC', 'uT', 'uAmt', 'uB', 'uRing', 'uSw', 'uVein', 'uSpec', 'uVig', 'uSeed', 'c0', 'c1', 'c2', 'c3', 'c4'].forEach(n => U[n] = gl.getUniformLocation(p, n));
  gl.viewport(0, 0, cv.width, cv.height); gl.uniform2f(U.uR, cv.width, cv.height);
  return s => {
    gl.uniform1f(U.uT, s.t); gl.uniform2f(U.uC, s.cx, s.cy); gl.uniform1f(U.uAmt, s.amt); gl.uniform1f(U.uB, s.B); gl.uniform1f(U.uRing, s.ring);
    gl.uniform1f(U.uSw, s.sw); gl.uniform1f(U.uVein, s.vein); gl.uniform1f(U.uSpec, s.spec); gl.uniform1f(U.uVig, s.vig); gl.uniform1f(U.uSeed, s.seed);
    for (let i = 0; i < 5; i++) gl.uniform3fv(U['c' + i], s.pal[i]);
    gl.drawArrays(gl.TRIANGLES, 0, 3);
  };
})();
const hex = h => [1, 3, 5].map(i => parseInt(h.substr(i, 2), 16) / 255);
const PAL = {
  ruby:  { pal: ['#140A0F', '#4A1631', '#B8123F', '#EA5174', '#F7D9DF'].map(hex), vein: .22, spec: .42, vig: .32 },
  shade: { pal: ['#1A0D0B', '#4A2A20', '#9C6448', '#D6A07B', '#F7E3D3'].map(hex), vein: .18, spec: .40, vig: .36 },
  cheek: { pal: ['#1E0914', '#4A1631', '#A3164A', '#EA5174', '#F7D9DF'].map(hex), vein: .20, spec: .45, vig: .34 },
  light: { pal: ['#A3264B', '#C4406A', '#DD6A8A', '#EFA0B4', '#F7D9DF'].map(hex), vein: .16, spec: .38, vig: .22 },
  ink:   { pal: ['#0C0609', '#1E0E16', '#3E1A2C', '#6E3A4E', '#D9B072'].map(hex), vein: .55, spec: .30, vig: .40 },
  plum:  { pal: ['#1A0712', '#4A1631', '#6E1E48', '#A82C5E', '#E79AB1'].map(hex), vein: .25, spec: .36, vig: .36 },
};
/* scene palettes + pigment amount; cross-fades are centred on the cuts */
const BG = [
  [0, 'ruby', .95], [2.5, 'ruby', .62], [5, 'shade', .80], [7.5, 'shade', .70], [9, 'cheek', .85], [12, 'light', 1], [16, 'ink', 1], [19, 'plum', .9], [22, 'ruby', .72],
];
function bgState(t) {
  let i = 0; while (i < BG.length - 1 && t >= BG[i + 1][0] - .12) i++;
  const cur = BG[i], prev = BG[Math.max(0, i - 1)];
  const k = i === 0 ? 1 : eio(pr(t, cur[0] - .12, cur[0] + .16));
  const A = PAL[prev[1]], B = PAL[cur[1]];
  const s = {
    pal: A.pal.map((c, j) => c.map((v, n) => mix(v, B.pal[j][n], k))),
    amt: mix(prev[2], cur[2], k), vein: mix(A.vein, B.vein, k), spec: mix(A.spec, B.spec, k), vig: mix(A.vig, B.vig, k),
    t: t * 1.35 + 14, cx: .5, cy: .5, B: 9, ring: 0, sw: 1.2, seed: 0,
  };
  /* scene 1: the drop lands at (540,960) and blooms */
  const kb = pr(t, .5, 2.1);
  if (t < 2.3) {
    s.B = t < .5 ? 0 : mix(.02, 1.9, eo3(kb));
    s.ring = t < .5 ? 0 : (1 - eo3(kb)) * 1.3;
    s.sw = t < .5 ? 0 : mix(7, 1.4, eo3(pr(t, .5, 1.9)));
  }
  /* each cut gives the liquid a little swirl kick (ties picture to the pulse) */
  [2.5, 5, 7.5, 9, 12, 14, 16, 19, 22].forEach(c => { const d = t - c; if (d > -.05 && d < 1.2) s.sw += 2.2 * Math.exp(-d * 3.2) * cl((d + .05) * 20); });
  /* end: fade pigment out */
  s.amt *= 1 - eio(pr(t, 24.3, 25));
  return s;

/* =========================================================
